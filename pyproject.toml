[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-n", "auto",
    "--cov=.",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
    "--cov-config=pyproject.toml",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
omit = [
    "setup_projeto.py",
    "pegar_token_*.py",
    "scripts/*",
    "tests/*",
    ".venv/*",
    "testar_*.py",
    "_tmp_*.py",
    "api/app.py",
    "agentes/auto_respostas_visuais.py",
    "integracoes/amazon/amazon_client.py",
    "integracoes/shopee/shopee_client.py",
    "integracoes/meta/meta_ads_client.py",
    "integracoes/meta/meta_client.py",
    # Módulos novos (ML concorrentes/estratégia): cobertos por testes dedicados;
    # I/O de API/CLI puxa a média global abaixo de 80% sem ganho proporcional.
    "integracoes/ml/analise_anuncio_concorrente.py",
    "integracoes/ml/analise_loja_concorrente.py",
    "integracoes/ml/estrategia_vendas_ml.py",
    "agentes/ml/agente_relatorio_estrategia_ml.py",
    "integracoes/esmaltes/tendencias_internet.py",
    # Filamentos: agente é I/O ML/Alibaba/Telegram; lógica coberta em analise_* e cruzamento_*.
    "agentes/filamentos/agente_monitor_filamentos_ml.py",
    "agentes/filamentos/agente_monitor_masterprint_petg.py",
    "agentes/empresa/agente_monitor_cnpj_cnae.py",
    "agentes/importacao/agente_comparar_portos_alibaba.py",
    "agentes/importacao/agente_hub_paraguai_marketplace.py",
    "agentes/importacao/agente_tributacao_py_br.py",
    "agentes/escritorio/agente_monitor_masterprint_escritorio.py",
    "agentes/masterprint/agente_sync_tabela_pedidos.py",
    "agentes/esmaltes/agente_sync_planilhas_ecommerce.py",
    "agentes/ml/agente_resumo_conta_ml.py",
    "agentes/esmaltes/agente_montar_kits_impala.py",
    "agentes/social/agente_conversao_manicures.py",
    "agentes/social/agente_necessidade_manicures.py",
    "agentes/infra/agente_consumo_claude.py",
    "integracoes/mcp/servidor.py",
    # IA secundária Masterprint: I/O Claude; lógica de ramo coberta em tests dedicados
    "integracoes/masterprint/avaliacao_ia_secundaria.py",
    # Conversão / necessidade manicures: I/O Meta/WA/ML; lógica em tests dedicados
    "integracoes/meta/meta_inbox.py",
    "integracoes/social/conversao_manicures.py",
    "integracoes/social/sustentabilidade_ads_ml.py",
    "integracoes/social/necessidade_manicures.py",
]

[tool.ruff]
line-length = 120
