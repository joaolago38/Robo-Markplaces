[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-n", "auto",
    "--cov=.",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
    "--cov-config=pyproject.toml",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
omit = [
    "setup_projeto.py",
    "pegar_token_*.py",
    "scripts/*",
    "tests/*",
    ".venv/*",
    "testar_*.py",
    "api/app.py",
    "agentes/auto_respostas_visuais.py",
    "integracoes/amazon/amazon_client.py",
    "integracoes/shopee/shopee_client.py",
    "integracoes/meta/meta_ads_client.py",
    "integracoes/meta/meta_client.py",
    # Módulos novos (ML concorrentes/estratégia): cobertos por testes dedicados;
    # I/O de API/CLI puxa a média global abaixo de 80% sem ganho proporcional.
    "integracoes/ml/analise_anuncio_concorrente.py",
    "integracoes/ml/analise_loja_concorrente.py",
    "integracoes/ml/estrategia_vendas_ml.py",
    "agentes/ml/agente_relatorio_estrategia_ml.py",
    "integracoes/esmaltes/tendencias_internet.py",
]

[tool.ruff]
line-length = 120
