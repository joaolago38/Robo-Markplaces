[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-n", "auto",
    "--cov=.",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
    "--cov-config=pyproject.toml",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
omit = [
    "setup_projeto.py",
    "pegar_token_*.py",
    "scripts/*",
    "tests/*",
    ".venv/*",
    "testar_*.py",
    "api/app.py",
    "agentes/auto_respostas_visuais.py",
    "integracoes/amazon/amazon_client.py",
    "integracoes/shopee/shopee_client.py",
]

[tool.ruff]
line-length = 120
