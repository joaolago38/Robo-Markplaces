[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "--cov=.",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
omit = [
    "setup_projeto.py",
    "pegar_token_*.py",
    "scripts/*",
    "tests/*",
    ".venv/*",
]

[tool.ruff]
line-length = 120
