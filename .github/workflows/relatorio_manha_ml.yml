name: Relatorio manha Mercado Livre

# Visão matinal: seus anúncios vs mercado + propostas com lucro viável.
# Consolida monitor ML, preços, concorrentes e Anita em um único Telegram.

on:
  workflow_dispatch:
  schedule:
    # 07:30 BRT (UTC-3) = 10:30 UTC — todo dia de manhã
    - cron: "30 10 * * *"

concurrency:
  group: robo-markplaces-token-renewal
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  DD_API_KEY: ${{ secrets.DD_API_KEY }}
  DD_SITE: ${{ secrets.DD_SITE || 'us5.datadoghq.com' }}
  DD_LOGS_ENABLED: ${{ secrets.DD_LOGS_ENABLED || 'true' }}
  DD_METRICS_ENABLED: ${{ vars.DD_METRICS_ENABLED || 'true' }}
  DD_ENV: ${{ vars.DD_ENV || 'production' }}

jobs:
  relatorio_manha:
    name: Relatorio manha ML consolidado
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Restaurar heartbeats de saude
        uses: actions/cache@v4
        with:
          path: |
            logs/orquestrador_ultimo_ciclo.json
            logs/operacao_24h_ultima.json
            logs/conectividade_ultima.json
            logs/renovacao_tokens_ultima.json
            logs/relatorio_manha_ml_ultima.json
            logs/esmaltes_mercado_history.json
          key: saude-heartbeats-${{ github.run_id }}
          restore-keys: |
            saude-heartbeats-
      - name: Restaurar cooldown Telegram
        uses: actions/cache@v4
        with:
          path: logs/alertas_cooldown.json
          key: telegram-cooldown-${{ github.run_id }}
          restore-keys: |
            telegram-cooldown-
      - name: Relatorio manha ML
        run: python -m agentes.ml.agente_relatorio_manha_ml
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_ACCESS_TOKEN: ${{ secrets.ML_ACCESS_TOKEN }}
          ML_REFRESH_TOKEN: ${{ secrets.ML_REFRESH_TOKEN }}
          ML_SELLER_ID: ${{ secrets.ML_SELLER_ID }}
          ML_SITE_ID: ${{ secrets.ML_SITE_ID }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_GESTOR_CHAT_ID: ${{ secrets.TELEGRAM_GESTOR_CHAT_ID }}
      - name: Publicar heartbeats de saude
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            logs/orquestrador_ultimo_ciclo.json
            logs/operacao_24h_ultima.json
            logs/conectividade_ultima.json
            logs/renovacao_tokens_ultima.json
            logs/relatorio_manha_ml_ultima.json
            logs/esmaltes_mercado_history.json
          key: saude-heartbeats-${{ github.run_id }}
      - name: Salvar snapshot
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-manha-ml
          path: logs/relatorio_manha_ml_ultima.json
          retention-days: 30
          if-no-files-found: ignore
