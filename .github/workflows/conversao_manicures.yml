name: Conversão manicures (WA / IG / FB / ML)

# Haiku escolhe oferta, divulga canais, lê inbox Meta/WA.
# Chat ML de fechamento = agentes.ml (CONVERSAO_MANICURES_CHAT_ML=0 padrão).

on:
  workflow_dispatch:
  schedule:
    # 3x/dia BRT 08:25 / 14:25 / 21:25 (= 11:25 / 17:25 / 00:25 UTC)
    - cron: "25 11 * * *"
    - cron: "25 17 * * *"
    - cron: "25 0 * * *"

concurrency:
  # Inclui Claude estado: conversão grava uso/toggle no mesmo cache Actions
  group: robo-markplaces-claude-estado
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  DD_API_KEY: ${{ secrets.DD_API_KEY }}
  DD_SITE: ${{ secrets.DD_SITE || 'us5.datadoghq.com' }}
  DD_LOGS_ENABLED: ${{ secrets.DD_LOGS_ENABLED || 'true' }}
  DD_METRICS_ENABLED: ${{ vars.DD_METRICS_ENABLED || 'true' }}
  DD_ENV: ${{ vars.DD_ENV || 'production' }}
  CONVERSAO_MANICURES_ATIVO: "1"
  CONVERSAO_MANICURES_ALERTA: "1"

jobs:
  converter:
    name: Conversão manicures Haiku
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Restaurar cooldown / historico / IA compartilhada
        uses: actions/cache@v4
        with:
          path: |
            logs/alertas_cooldown.json
            logs/conversao_manicures_historico.json
            logs/leads_manicures.json
            logs/claude_uso_orcamento.json
            logs/claude_toggle.json
            logs/conversao_manicures_ultima.json
            logs/chat_perguntas_claimed.json
          key: conversao-manicures-${{ github.run_id }}
          restore-keys: |
            conversao-manicures-
            estado-vendas-ia-
            claude-orcamento-
            telegram-cooldown-
      - name: Rodar conversão manicures
        run: python -m agentes.social.agente_conversao_manicures
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_ATIVO: ${{ vars.CLAUDE_ATIVO || '1' }}
          CLAUDE_MODELO_RAPIDO: claude-haiku-4-5
          CLAUDE_ORCAMENTO_ATIVO: "1"
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_ACCESS_TOKEN: ${{ secrets.ML_ACCESS_TOKEN }}
          ML_REFRESH_TOKEN: ${{ secrets.ML_REFRESH_TOKEN }}
          ML_SELLER_ID: ${{ secrets.ML_SELLER_ID }}
          ML_SITE_ID: ${{ secrets.ML_SITE_ID }}
          ML_LOJA_URL: ${{ secrets.ML_LOJA_URL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_GESTOR_CHAT_ID: ${{ secrets.TELEGRAM_GESTOR_CHAT_ID }}
          TELEGRAM_MANICURES_CHAT_ID: ${{ secrets.TELEGRAM_MANICURES_CHAT_ID }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WHATSAPP_API_TYPE: evolution
          WHATSAPP_API_URL: ${{ secrets.WHATSAPP_API_URL }}
          WHATSAPP_API_KEY: ${{ secrets.WHATSAPP_API_KEY }}
          WHATSAPP_INSTANCE: ${{ secrets.WHATSAPP_INSTANCE }}
          WHATSAPP_GRUPO_MANICURES_ID: ${{ secrets.WHATSAPP_GRUPO_MANICURES_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_INSTAGRAM_ID: ${{ secrets.META_INSTAGRAM_ID }}
          META_API_VERSION: ${{ secrets.META_API_VERSION }}
          CONVERSAO_MANICURES_PUBLICAR_FB: ${{ vars.CONVERSAO_MANICURES_PUBLICAR_FB || '0' }}
          CONVERSAO_MANICURES_PUBLICAR_IG: ${{ vars.CONVERSAO_MANICURES_PUBLICAR_IG || '0' }}
          CONVERSAO_MANICURES_REPLY_META: ${{ vars.CONVERSAO_MANICURES_REPLY_META || '0' }}
          CONVERSAO_MANICURES_REPLY_WA: ${{ vars.CONVERSAO_MANICURES_REPLY_WA || '0' }}
          CONVERSAO_MANICURES_CHAT_ML: ${{ vars.CONVERSAO_MANICURES_CHAT_ML || '0' }}
          CONVERSAO_BLOQUEAR_LINK_INVALIDO: "1"
          CONVERSAO_MANICURES_IMAGEM_IG_URL: ${{ secrets.CONVERSAO_MANICURES_IMAGEM_IG_URL }}
          CONVERSAO_MANICURES_COOLDOWN_SEG: "18000"
          CONVERSAO_MANICURES_SUSTENTABILIDADE: "1"
          CONVERSAO_MANICURES_BLOQUEAR_SE_INSUSTENTAVEL: "1"
          CONVERSAO_MANICURES_SUST_DIAS: "1"
          META_ROAS_MINIMO_MANICURES: "2.20"
      - name: Publicar estado vendas/IA (cache compartilhado)
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            logs/claude_uso_orcamento.json
            logs/claude_toggle.json
            logs/conversao_manicures_ultima.json
            logs/chat_perguntas_claimed.json
          key: estado-vendas-ia-${{ github.run_id }}
      - name: Salvar snapshot
        uses: actions/upload-artifact@v4
        with:
          name: conversao-manicures
          path: |
            logs/conversao_manicures_ultima.json
            logs/conversao_manicures_historico.json
            logs/leads_manicures.json
            logs/claude_uso_orcamento.json
            logs/claude_toggle.json
          retention-days: 30
          if-no-files-found: ignore
