name: Monitor Sumare Leiloes

# PREFEITURA/DETRAN no site oficial — veículos com documento, alerta de lances.
# Acompanhamento secundário: 1x/dia — fora do grupo OAuth Impala/ML e do orquestrador 30min.

on:
  workflow_dispatch:
  schedule:
    # 1x/dia BRT 09:00 (= 12:00 UTC)
    - cron: "0 12 * * *"

concurrency:
  group: robo-markplaces-monitor-secundario
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  DD_API_KEY: ${{ secrets.DD_API_KEY }}
  DD_SITE: ${{ secrets.DD_SITE || 'us5.datadoghq.com' }}
  DD_LOGS_ENABLED: ${{ secrets.DD_LOGS_ENABLED || 'true' }}
  DD_METRICS_ENABLED: ${{ vars.DD_METRICS_ENABLED || 'true' }}
  DD_ENV: ${{ vars.DD_ENV || 'production' }}
  SUMARE_LEILOES_PAUSA_ENTRE_LEILOES_SEG: "2.5"
  SUMARE_LEILOES_RETRY_MAX: "3"
  SUMARE_LEILOES_TIMEOUT_SEG: "45"
  SUMARE_LEILOES_ALERTA_RESUMO: "0"

jobs:
  monitorar:
    name: Sumare — prefeitura/DETRAN com documento
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Restaurar cooldown Telegram
        uses: actions/cache@v4
        with:
          path: logs/alertas_cooldown.json
          key: telegram-cooldown-${{ github.run_id }}
          restore-keys: |
            telegram-cooldown-
      - name: Restaurar historico Sumare
        uses: actions/cache@v4
        with:
          path: logs/sumare_leiloes_history.json
          key: sumare-leiloes-${{ github.run_id }}
          restore-keys: |
            sumare-leiloes-
      - name: Preflight Telegram (gestor)
        run: python scripts/preflight_monitor_telegram.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_GESTOR_CHAT_ID: ${{ secrets.TELEGRAM_GESTOR_CHAT_ID }}
      - name: Rodar monitor Sumare Leiloes
        run: python -m agentes.leilao.agente_monitor_sumare_leiloes
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_GESTOR_CHAT_ID: ${{ secrets.TELEGRAM_GESTOR_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_ATIVO: ${{ vars.CLAUDE_ATIVO || '1' }}
      - name: Salvar snapshot
        uses: actions/upload-artifact@v4
        with:
          name: sumare-leiloes-snapshot
          path: logs/sumare_leiloes_ultima.json
          retention-days: 60
          if-no-files-found: ignore
