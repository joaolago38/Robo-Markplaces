name: Monitor Buy Box ML

on:
  workflow_dispatch:
  schedule:
    # A cada 2h — buy box muda mais rápido que o radar de 4h
    - cron: "0 */2 * * *"

concurrency:
  group: robo-markplaces-${{ github.workflow }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  DD_API_KEY: ${{ secrets.DD_API_KEY }}
  DD_SITE: ${{ secrets.DD_SITE || 'us5.datadoghq.com' }}
  DD_LOGS_ENABLED: ${{ secrets.DD_LOGS_ENABLED || 'true' }}
  DD_METRICS_ENABLED: ${{ vars.DD_METRICS_ENABLED || 'true' }}
  DD_ENV: ${{ vars.DD_ENV || 'production' }}

jobs:
  monitorar:
    name: Ofertas de catálogo compartilhado (buy box por posição na lista)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Restaurar historico buy box
        uses: actions/cache@v4
        with:
          path: logs/buybox_history.json
          key: buybox-ml-${{ github.run_id }}
          restore-keys: |
            buybox-ml-
      - name: Rodar monitor de buy box
        run: python -m agentes.ml.agente_monitor_buybox
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_ACCESS_TOKEN: ${{ secrets.ML_ACCESS_TOKEN }}
          ML_REFRESH_TOKEN: ${{ secrets.ML_REFRESH_TOKEN }}
          ML_SELLER_ID: ${{ secrets.ML_SELLER_ID }}
          ML_SITE_ID: ${{ secrets.ML_SITE_ID }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_GESTOR_CHAT_ID: ${{ secrets.TELEGRAM_GESTOR_CHAT_ID }}
      - name: Salvar historico atualizado
        uses: actions/upload-artifact@v4
        with:
          name: buybox-ml-history
          path: logs/buybox_history.json
          retention-days: 90
      - name: Publicar cache buy box
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: logs/buybox_history.json
          key: buybox-ml-${{ github.run_id }}
