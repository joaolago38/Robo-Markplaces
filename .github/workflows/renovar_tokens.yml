# Renovação preventiva de tokens — Shopee (~4h) e Magalu (~1–2h) especialmente curtos.
#
# SERIALIZAÇÃO DE RENOVAÇÃO DE TOKENS:
# Vários workflows (renovar_tokens, chat_marketplaces, operacao_24h, etc.) podem
# disparar renovação OAuth em paralelo. refresh_tokens de uso único (ML, Magalu,
# Bling) rotacionam a cada refresh — duas execuções simultâneas deixam um token
# órfão nos Secrets. O grupo `robo-markplaces-token-renewal` garante que só uma
# renovação rode por vez em todo o repositório.
name: Renovar tokens marketplace

on:
  schedule:
    # A cada 30 min em UTC (GitHub). Em BRT = deslocado −3h (ex.: 00:00 UTC = 21:00 BRT).
    # Shopee/Magalu têm TTL curto; reduza só se atualizar tokens por outro meio.
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: robo-markplaces-token-renewal
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  DD_API_KEY: ${{ secrets.DD_API_KEY }}
  DD_SITE: ${{ secrets.DD_SITE }}
  DD_LOGS_ENABLED: ${{ secrets.DD_LOGS_ENABLED }}

jobs:
  renovar:
    # GH_TOKEN precisa ser um PAT com escopo secrets:write (GITHUB_TOKEN padrão NÃO grava Secret).
    name: Renovar Bling / ML / Shopee / Magalu / Meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Tentar renovar tokens
        run: python scripts/renovar_tokens.py
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BLING_CLIENT_ID: ${{ secrets.BLING_CLIENT_ID }}
          BLING_CLIENT_SECRET: ${{ secrets.BLING_CLIENT_SECRET }}
          BLING_ACCESS_TOKEN: ${{ secrets.BLING_ACCESS_TOKEN }}
          BLING_REFRESH_TOKEN: ${{ secrets.BLING_REFRESH_TOKEN }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_REFRESH_TOKEN: ${{ secrets.ML_REFRESH_TOKEN }}
          ML_ACCESS_TOKEN: ${{ secrets.ML_ACCESS_TOKEN }}
          ML_SELLER_ID: ${{ secrets.ML_SELLER_ID }}
          SHOPEE_PARTNER_ID: ${{ secrets.SHOPEE_PARTNER_ID }}
          SHOPEE_PARTNER_KEY: ${{ secrets.SHOPEE_PARTNER_KEY }}
          SHOPEE_SHOP_ID: ${{ secrets.SHOPEE_SHOP_ID }}
          SHOPEE_ACCESS_TOKEN: ${{ secrets.SHOPEE_ACCESS_TOKEN }}
          SHOPEE_REFRESH_TOKEN: ${{ secrets.SHOPEE_REFRESH_TOKEN }}
          MAGALU_CLIENT_ID: ${{ secrets.MAGALU_CLIENT_ID }}
          MAGALU_CLIENT_SECRET: ${{ secrets.MAGALU_CLIENT_SECRET }}
          MAGALU_MERCHANT_ID: ${{ secrets.MAGALU_MERCHANT_ID }}
          MAGALU_ACCESS_TOKEN: ${{ secrets.MAGALU_ACCESS_TOKEN }}
          MAGALU_REFRESH_TOKEN: ${{ secrets.MAGALU_REFRESH_TOKEN }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          META_API_VERSION: ${{ secrets.META_API_VERSION }}
