# Renovação preventiva de tokens — Shopee (~4h), Magalu (~1h), Bling (~6h).
# Salva os tokens renovados de volta nos GitHub Secrets via API.
name: Renovar tokens marketplace

on:
  schedule:
    - cron: "*/30 * * * *"   # a cada 30 min (UTC)
  workflow_dispatch:           # permite rodar manualmente

permissions:
  contents: read
  secrets:  write              # NECESSARIO para salvar tokens renovados

env:
  PYTHON_VERSION: "3.11"

jobs:
  renovar:
    name: Renovar ML / Shopee / Magalu / Bling
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install PyNaCl

      - name: Renovar tokens e salvar nos GitHub Secrets
        run: python scripts/renovar_tokens.py
        env:
          # GitHub — para escrever os tokens renovados de volta nos Secrets
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Bling
          BLING_CLIENT_ID:     ${{ secrets.BLING_CLIENT_ID }}
          BLING_CLIENT_SECRET: ${{ secrets.BLING_CLIENT_SECRET }}
          BLING_ACCESS_TOKEN:  ${{ secrets.BLING_ACCESS_TOKEN }}
          BLING_REFRESH_TOKEN: ${{ secrets.BLING_REFRESH_TOKEN }}

          # Mercado Livre
          ML_CLIENT_ID:     ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_REFRESH_TOKEN: ${{ secrets.ML_REFRESH_TOKEN }}
          ML_ACCESS_TOKEN:  ${{ secrets.ML_ACCESS_TOKEN }}
          ML_SELLER_ID:     ${{ secrets.ML_SELLER_ID }}

          # Shopee
          SHOPEE_PARTNER_ID:    ${{ secrets.SHOPEE_PARTNER_ID }}
          SHOPEE_PARTNER_KEY:   ${{ secrets.SHOPEE_PARTNER_KEY }}
          SHOPEE_SHOP_ID:       ${{ secrets.SHOPEE_SHOP_ID }}
          SHOPEE_ACCESS_TOKEN:  ${{ secrets.SHOPEE_ACCESS_TOKEN }}
          SHOPEE_REFRESH_TOKEN: ${{ secrets.SHOPEE_REFRESH_TOKEN }}

          # Magalu
          MAGALU_CLIENT_ID:     ${{ secrets.MAGALU_CLIENT_ID }}
          MAGALU_CLIENT_SECRET: ${{ secrets.MAGALU_CLIENT_SECRET }}
          MAGALU_MERCHANT_ID:   ${{ secrets.MAGALU_MERCHANT_ID }}
          MAGALU_ACCESS_TOKEN:  ${{ secrets.MAGALU_ACCESS_TOKEN }}
          MAGALU_REFRESH_TOKEN: ${{ secrets.MAGALU_REFRESH_TOKEN }}

          # Telegram — alertas de falha
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
