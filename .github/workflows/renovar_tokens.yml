name: Renovar tokens marketplace

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  renovar:
    name: Renovar ML / Shopee / Magalu
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install PyNaCl

      - name: Renovar tokens
        run: python scripts/renovar_tokens.py
        env:
          GH_TOKEN:             ${{ secrets.GH_TOKEN }}
          ML_CLIENT_ID:         ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET:     ${{ secrets.ML_CLIENT_SECRET }}
          ML_REFRESH_TOKEN:     ${{ secrets.ML_REFRESH_TOKEN }}
          ML_ACCESS_TOKEN:      ${{ secrets.ML_ACCESS_TOKEN }}
          ML_SELLER_ID:         ${{ secrets.ML_SELLER_ID }}
          SHOPEE_PARTNER_ID:    ${{ secrets.SHOPEE_PARTNER_ID }}
          SHOPEE_PARTNER_KEY:   ${{ secrets.SHOPEE_PARTNER_KEY }}
          SHOPEE_SHOP_ID:       ${{ secrets.SHOPEE_SHOP_ID }}
          SHOPEE_ACCESS_TOKEN:  ${{ secrets.SHOPEE_ACCESS_TOKEN }}
          SHOPEE_REFRESH_TOKEN: ${{ secrets.SHOPEE_REFRESH_TOKEN }}
          MAGALU_CLIENT_ID:     ${{ secrets.MAGALU_CLIENT_ID }}
          MAGALU_CLIENT_SECRET: ${{ secrets.MAGALU_CLIENT_SECRET }}
          MAGALU_MERCHANT_ID:   ${{ secrets.MAGALU_MERCHANT_ID }}
          MAGALU_ACCESS_TOKEN:  ${{ secrets.MAGALU_ACCESS_TOKEN }}
          MAGALU_REFRESH_TOKEN: ${{ secrets.MAGALU_REFRESH_TOKEN }}
          TELEGRAM_TOKEN:       ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Notificar falha no Telegram
        if: failure()
        run: |
          python - <<'PYEOF'
          import os, requests, sys
          token   = os.getenv("TELEGRAM_TOKEN",   "")
          chat_id = os.getenv("TELEGRAM_CHAT_ID", "")
          if not token or not chat_id:
              print("Telegram nao configurado")
              sys.exit(0)
          requests.post(
              f"https://api.telegram.org/bot{token}/sendMessage",
              json={"chat_id": chat_id, "text": "🚨 renovar_tokens.yml falhou. Acesse o GitHub Actions.", "parse_mode": "Markdown"},
              timeout=10,
          )
          PYEOF
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}