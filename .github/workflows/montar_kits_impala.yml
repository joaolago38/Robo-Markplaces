name: Montar Kits Impala (planilha x ML)

# Cruza cores Impala da planilha NCM com kits mais vendidos no ML → Telegram.

on:
  workflow_dispatch:
  schedule:
    # 3x/dia BRT 08:00 / 14:00 / 21:00 (= 11:00 / 17:00 / 00:00 UTC)
    - cron: "0 11 * * *"
    - cron: "0 17 * * *"
    - cron: "0 0 * * *"

concurrency:
  group: robo-markplaces-token-renewal
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  DD_API_KEY: ${{ secrets.DD_API_KEY }}
  DD_SITE: ${{ secrets.DD_SITE }}
  DD_LOGS_ENABLED: ${{ secrets.DD_LOGS_ENABLED }}
  DD_METRICS_ENABLED: ${{ vars.DD_METRICS_ENABLED || 'true' }}
  DD_ENV: ${{ vars.DD_ENV || 'production' }}
  MONTAR_KITS_IMPALA_ALERTA: "1"

jobs:
  montar:
    name: Planilha Impala × kits ML → Telegram
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Restaurar cooldown Telegram
        uses: actions/cache@v4
        with:
          path: logs/alertas_cooldown.json
          key: telegram-cooldown-${{ github.run_id }}
          restore-keys: |
            telegram-cooldown-
      - name: Preflight Telegram (gestor)
        run: python scripts/preflight_monitor_telegram.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_GESTOR_CHAT_ID: ${{ secrets.TELEGRAM_GESTOR_CHAT_ID }}
      - name: Rodar montar kits Impala
        run: python -m agentes.esmaltes.agente_montar_kits_impala
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_ACCESS_TOKEN: ${{ secrets.ML_ACCESS_TOKEN }}
          ML_REFRESH_TOKEN: ${{ secrets.ML_REFRESH_TOKEN }}
          ML_SELLER_ID: ${{ secrets.ML_SELLER_ID }}
          ML_SITE_ID: ${{ secrets.ML_SITE_ID }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_GESTOR_CHAT_ID: ${{ secrets.TELEGRAM_GESTOR_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_ATIVO: ${{ vars.CLAUDE_ATIVO || '1' }}
          MONTAR_KITS_IMPALA_ALERTA: "1"
      - name: Salvar snapshot
        uses: actions/upload-artifact@v4
        with:
          name: montar-kits-impala
          path: logs/montar_kits_impala_ultima.json
          retention-days: 30
          if-no-files-found: ignore
