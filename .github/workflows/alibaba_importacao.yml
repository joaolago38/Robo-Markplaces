name: Monitor Alibaba Importação

on:
  workflow_dispatch:
  schedule:
    # A cada 2 horas (UTC)
    - cron: "0 */2 * * *"

concurrency:
  group: robo-markplaces-token-renewal
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  DD_API_KEY: ${{ secrets.DD_API_KEY }}
  DD_SITE: ${{ secrets.DD_SITE }}
  DD_LOGS_ENABLED: ${{ secrets.DD_LOGS_ENABLED }}
  DD_METRICS_ENABLED: ${{ vars.DD_METRICS_ENABLED || 'true' }}
  DD_ENV: ${{ vars.DD_ENV || 'production' }}
  CAMBIO_BLOQUEAR_FALLBACK_MARGEM: "1"
  CAMBIO_MAX_IDADE_SEG: "21600"
  ALIBABA_EXIGIR_MOQ_PARA_OPORTUNIDADE: "0"
  DDG_MIN_INTERVAL_SEG: "8"

jobs:
  monitorar:
    name: Oportunidades de importação no Alibaba.com
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Restaurar histórico de oportunidades
        uses: actions/cache@v4
        with:
          path: logs/alibaba_importacao_history.json
          key: alibaba-importacao-history-${{ github.run_id }}
          restore-keys: |
            alibaba-importacao-history-
      - name: Restaurar cooldown de alertas Telegram
        uses: actions/cache@v4
        with:
          path: logs/alertas_cooldown.json
          key: telegram-cooldown-${{ github.run_id }}
          restore-keys: |
            telegram-cooldown-
      - name: Preflight Telegram (gestor)
        run: python scripts/preflight_monitor_telegram.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_GESTOR_CHAT_ID: ${{ secrets.TELEGRAM_GESTOR_CHAT_ID }}
      - name: Rodar Alibaba sourcing + tendências ML
        run: |
          python -m agentes.importacao.agente_alibaba_sourcing
          python -m agentes.importacao.agente_ml_tendencias_importacao
        env:
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_ACCESS_TOKEN: ${{ secrets.ML_ACCESS_TOKEN }}
          ML_REFRESH_TOKEN: ${{ secrets.ML_REFRESH_TOKEN }}
          ML_SELLER_ID: ${{ secrets.ML_SELLER_ID }}
          ML_SITE_ID: ${{ secrets.ML_SITE_ID }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_GESTOR_CHAT_ID: ${{ secrets.TELEGRAM_GESTOR_CHAT_ID }}
          ALIBABA_SOURCING_ATIVO: "1"
      - name: Salvar historico (backup)
        uses: actions/upload-artifact@v4
        with:
          name: alibaba-importacao-history
          path: logs/alibaba_importacao_history.json
          retention-days: 90
          if-no-files-found: ignore
