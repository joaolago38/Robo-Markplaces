name: Monitor Mercado Livre

on:
  workflow_dispatch:
  schedule:
    # 09:00 BRT (UTC-3) = 12:00 UTC
    - cron: "0 10 * * *"

env:
  PYTHON_VERSION: "3.11"
  DD_API_KEY: ${{ secrets.DD_API_KEY }}
  DD_SITE: ${{ secrets.DD_SITE }}
  DD_LOGS_ENABLED: ${{ secrets.DD_LOGS_ENABLED }}

jobs:
  monitor:
    name: Diagnostico ML (conta + ads + concorrencia)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Rodar agente monitor ML
        run: python -m agentes.ml.agente_monitor_ml
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ML_CLIENT_ID:              ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET:          ${{ secrets.ML_CLIENT_SECRET }}
          ML_ACCESS_TOKEN:           ${{ secrets.ML_ACCESS_TOKEN }}
          ML_REFRESH_TOKEN:          ${{ secrets.ML_REFRESH_TOKEN }}
          ML_SELLER_ID:              ${{ secrets.ML_SELLER_ID }}
          TELEGRAM_TOKEN:            ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_GESTOR_CHAT_ID:   ${{ secrets.TELEGRAM_GESTOR_CHAT_ID }}
