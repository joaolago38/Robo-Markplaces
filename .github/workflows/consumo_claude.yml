name: Consumo Claude (orçamento)

# Painel US$ usado / restante → Telegram gestor.

on:
  workflow_dispatch:
  schedule:
    # A cada 6h UTC
    - cron: "15 0,6,12,18 * * *"

concurrency:
  # Serializa gravações do cache Claude (uso/toggle) entre painéis e agentes de IA
  group: robo-markplaces-claude-estado
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  DD_API_KEY: ${{ secrets.DD_API_KEY }}
  DD_SITE: ${{ secrets.DD_SITE || 'us5.datadoghq.com' }}
  DD_LOGS_ENABLED: ${{ secrets.DD_LOGS_ENABLED || 'true' }}
  DD_METRICS_ENABLED: ${{ vars.DD_METRICS_ENABLED || 'true' }}
  DD_ENV: ${{ vars.DD_ENV || 'production' }}

jobs:
  painel:
    name: Orçamento Claude → Telegram
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Restaurar uso/cooldown
        uses: actions/cache@v4
        with:
          path: |
            logs/claude_uso_orcamento.json
            logs/claude_saldo_painel_ultima.json
            logs/claude_toggle.json
            logs/alertas_cooldown.json
          key: estado-vendas-ia-${{ github.run_id }}
          restore-keys: |
            estado-vendas-ia-
            claude-orcamento-
            consumo-claude-
            telegram-cooldown-
      - name: Painel consumo Claude
        run: python -m agentes.infra.agente_consumo_claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_ADMIN_API_KEY: ${{ secrets.ANTHROPIC_ADMIN_API_KEY }}
          CLAUDE_ATIVO: ${{ vars.CLAUDE_ATIVO || '1' }}
          CLAUDE_ECONOMICO: ${{ vars.CLAUDE_ECONOMICO || '0' }}
          CLAUDE_MODELO: ${{ vars.CLAUDE_MODELO || 'claude-haiku-4-5' }}
          CLAUDE_MODELO_RAPIDO: ${{ vars.CLAUDE_MODELO_RAPIDO || 'claude-haiku-4-5' }}
          CLAUDE_MODELO_VENDAS: ${{ vars.CLAUDE_MODELO_VENDAS || 'claude-sonnet-4-5' }}
          CLAUDE_ESCALONAR_ML: ${{ vars.CLAUDE_ESCALONAR_ML || '1' }}
          CLAUDE_ESCALONAR_RESTANTE_MIN_USD: ${{ vars.CLAUDE_ESCALONAR_RESTANTE_MIN_USD || '4' }}
          CLAUDE_ORCAMENTO_USD: ${{ vars.CLAUDE_ORCAMENTO_USD || '22' }}
          CLAUDE_SALDO_CONSOLE_USD: ${{ vars.CLAUDE_SALDO_CONSOLE_USD }}
          CLAUDE_ORCAMENTO_ATIVO: "1"
          CLAUDE_ORCAMENTO_ALERTA: "1"
          CLAUDE_ORCAMENTO_ALERTA_TODAS: "1"
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_GESTOR_CHAT_ID: ${{ secrets.TELEGRAM_GESTOR_CHAT_ID }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Ligar Claude no cache
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: python scripts/toggle_claude.py on --motivo saldo_ok --por consumo_claude
      - name: Publicar orçamento Claude
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            logs/claude_uso_orcamento.json
            logs/claude_saldo_painel_ultima.json
            logs/claude_toggle.json
            logs/alertas_cooldown.json
          key: estado-vendas-ia-${{ github.run_id }}
      - name: Artifact
        uses: actions/upload-artifact@v4
        with:
          name: consumo-claude
          path: |
            logs/claude_uso_orcamento.json
            logs/claude_saldo_painel_ultima.json
            logs/consumo_claude_ultima.json
          retention-days: 30
          if-no-files-found: ignore
