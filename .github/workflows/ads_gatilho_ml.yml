name: Gatilho Product Ads ML

on:
  workflow_dispatch:
  schedule:
    # 08:00 BRT (UTC-3) = 11:00 UTC — após relatório manhã (07:30)
    - cron: "0 11 * * *"

env:
  PYTHON_VERSION: "3.11"
  DD_API_KEY: ${{ secrets.DD_API_KEY }}
  DD_SITE: ${{ secrets.DD_SITE || 'us5.datadoghq.com' }}
  DD_LOGS_ENABLED: ${{ secrets.DD_LOGS_ENABLED || 'true' }}
  DD_METRICS_ENABLED: ${{ vars.DD_METRICS_ENABLED || 'true' }}
  DD_ENV: ${{ vars.DD_ENV || 'production' }}

jobs:
  gatilho:
    name: Gatilho ads ML (ligar/pausar/escalar com confirmação)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Rodar agente gatilho ads ML
        run: python -m agentes.ml.agente_ads_gatilho
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ML_CLIENT_ID:              ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET:          ${{ secrets.ML_CLIENT_SECRET }}
          ML_ACCESS_TOKEN:           ${{ secrets.ML_ACCESS_TOKEN }}
          ML_REFRESH_TOKEN:          ${{ secrets.ML_REFRESH_TOKEN }}
          ML_SELLER_ID:              ${{ secrets.ML_SELLER_ID }}
          TELEGRAM_TOKEN:            ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_GESTOR_CHAT_ID:   ${{ secrets.TELEGRAM_GESTOR_CHAT_ID }}

      - name: Publicar heartbeat ads
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            logs/ads_gatilho_ultima.json
            logs/orquestrador_ultimo_ciclo.json
            logs/operacao_24h_ultima.json
            logs/conectividade_ultima.json
            logs/renovacao_tokens_ultima.json
            logs/relatorio_manha_ml_ultima.json
            logs/esmaltes_mercado_history.json
            logs/estoque_ultima.json
            logs/chat_ultima.json
            logs/nfe_ultima.json
            logs/vendas_whatsapp_ultima.json
          key: saude-heartbeats-${{ github.run_id }}
