name: Orquestrador 30min

# Executa todos os agentes de monitoramento a cada 30 minutos e envia
# resumo consolidado ao Telegram gestor + métricas ao Datadog.

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: robo-markplaces-token-renewal
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  DD_API_KEY: ${{ secrets.DD_API_KEY }}
  DD_SITE: ${{ secrets.DD_SITE || 'us5.datadoghq.com' }}
  DD_LOGS_ENABLED: ${{ secrets.DD_LOGS_ENABLED || 'true' }}
  DD_METRICS_ENABLED: ${{ vars.DD_METRICS_ENABLED || 'true' }}
  DD_ENV: ${{ vars.DD_ENV || 'production' }}
  DDG_BACKEND: ${{ secrets.DDG_BACKEND || 'auto' }}
  DDG_MIN_INTERVAL_SEG: ${{ secrets.DDG_MIN_INTERVAL_SEG || '8' }}
  DDG_CIRCUIT_BREAKER_SEG: ${{ secrets.DDG_CIRCUIT_BREAKER_SEG || '600' }}
  DDG_FALHAS_403_PARA_BREAKER: ${{ secrets.DDG_FALHAS_403_PARA_BREAKER || '8' }}
  BRAVE_QUOTA_MES: ${{ vars.BRAVE_QUOTA_MES || '1800' }}
  BRAVE_QUOTA_ALERTA_PCT: ${{ vars.BRAVE_QUOTA_ALERTA_PCT || '80' }}
  BRAVE_QUOTA_HARD_STOP: ${{ vars.BRAVE_QUOTA_HARD_STOP || '1' }}

jobs:
  orquestrador:
    name: Ciclo completo — todos os agentes
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Restaurar cota Brave
        uses: actions/cache@v4
        with:
          path: logs/brave_uso_mensal.json
          key: brave-uso-mensal-${{ github.run_id }}
          restore-keys: |
            brave-uso-mensal-
      - name: Restaurar heartbeats de saude
        uses: actions/cache@v4
        with:
          path: |
            logs/orquestrador_ultimo_ciclo.json
            logs/operacao_24h_ultima.json
            logs/conectividade_ultima.json
            logs/renovacao_tokens_ultima.json
            logs/relatorio_manha_ml_ultima.json
            logs/esmaltes_mercado_history.json
            logs/estoque_ultima.json
            logs/ads_gatilho_ultima.json
            logs/ads_product_ads_404.json
            logs/chat_ultima.json
            logs/nfe_ultima.json
            logs/vendas_whatsapp_ultima.json
            logs/decisao_oscilacao_ultima.json
            logs/briefing_ruptura_impala_ultima.json
            logs/kits_compativeis_manicures_ultima.json
            logs/ponto_ruptura_segundo_cnpj_ultima.json
          key: saude-heartbeats-${{ github.run_id }}
          restore-keys: |
            saude-heartbeats-
      - name: Restaurar cooldown de alertas Telegram
        uses: actions/cache@v4
        with:
          path: logs/alertas_cooldown.json
          key: telegram-cooldown-${{ github.run_id }}
          restore-keys: |
            telegram-cooldown-
      - name: Restaurar orçamento Claude + snapshot conversão + claim chat
        # Cache shared com consumo/conversão/necessidade (group robo-markplaces-claude-estado).
        # Orquestrador permanece em token-renewal; last-write-wins residual mitigado pelo
        # fail-closed do gate Claude e pelo DynamoDB versionado quando STORAGE_BACKEND=dynamodb.
        uses: actions/cache@v4
        with:
          path: |
            logs/claude_uso_orcamento.json
            logs/claude_toggle.json
            logs/marketplaces_operacao.json
            logs/conversao_manicures_ultima.json
            logs/chat_perguntas_claimed.json
            logs/brave_uso_mensal.json
          key: estado-vendas-ia-${{ github.run_id }}
          restore-keys: |
            estado-vendas-ia-
            claude-orcamento-
            conversao-snapshot-
      - name: Restaurar historico leiloes
        uses: actions/cache@v4
        with:
          path: logs/leilao_veiculos_history.json
          key: leilao-veiculos-history-${{ github.run_id }}
          restore-keys: |
            leilao-veiculos-history-
      - name: Restaurar historico Alibaba
        uses: actions/cache@v4
        with:
          path: logs/alibaba_importacao_history.json
          key: alibaba-importacao-history-${{ github.run_id }}
          restore-keys: |
            alibaba-importacao-history-
      - name: Restaurar historico concorrentes ML + cache busca
        uses: actions/cache@v4
        with:
          path: |
            logs/concorrentes_ml_history.json
            logs/ml_busca_termo_cache.json
            logs/sem_venda_ml_ultima.json
            logs/precificacao_inteligencia_history.json
          key: ml-concorrentes-history-${{ github.run_id }}
          restore-keys: |
            ml-concorrentes-history-
      - name: Diagnostico Datadog (intake)
        continue-on-error: true
        run: python scripts/diagnostico_datadog.py
      - name: Preflight producao (Telegram + ML)
        run: python scripts/preflight_producao.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_GESTOR_CHAT_ID: ${{ secrets.TELEGRAM_GESTOR_CHAT_ID }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_REFRESH_TOKEN: ${{ secrets.ML_REFRESH_TOKEN }}
          ML_ACCESS_TOKEN: ${{ secrets.ML_ACCESS_TOKEN }}
      - name: Validar catálogo MLB (soft)
        continue-on-error: true
        run: python scripts/validar_catalogo_ml.py --alerta
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_GESTOR_CHAT_ID: ${{ secrets.TELEGRAM_GESTOR_CHAT_ID }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Rodar orquestrador 30min
        run: python -m agentes.orquestrador.agente_orquestrador
        env:
          ORQUESTRADOR_EXCLUIR: leilao,sumare_leiloes,lojas_veiculos,carros_batidos,licitacoes,alibaba_sourcing,comparar_portos_alibaba,ml_tendencias_importacao,monitor_filamentos_ml,monitor_masterprint_petg,monitor_masterprint_escritorio,monitor_cnpj_cnae,ponto_ruptura_segundo_cnpj,ponto_ruptura_outra_marca,ads_gatilho,relatorio_estrategia_ml,relatorio_manha_ml,vigia_datadog,promocoes_manicures,resumo_conta_ml,conversao_manicures,necessidade_manicures,consumo_claude,montar_kits_impala,esmaltes_operacao,comparativo_anita_impala,monitor_busca_kit_esmaltes,sincronizar_estoque,repricing,repricing_impala,operacao_24h,chat_shopee,chat_magalu,chat_amazon,auto_respostas
          ORQUESTRADOR_PAUSA_ENTRE_AGENTES_SEG: "0.4"
          CONVERSAO_MANICURES_CHAT_ML: "0"
          AUTO_RESPOSTAS_ML: "0"
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_ATIVO: ${{ vars.CLAUDE_ATIVO || '1' }}
          BLING_CLIENT_ID: ${{ secrets.BLING_CLIENT_ID }}
          BLING_CLIENT_SECRET: ${{ secrets.BLING_CLIENT_SECRET }}
          BLING_ACCESS_TOKEN: ${{ secrets.BLING_ACCESS_TOKEN }}
          BLING_REFRESH_TOKEN: ${{ secrets.BLING_REFRESH_TOKEN }}
          LOJAHUB_TOKEN: ${{ secrets.LOJAHUB_TOKEN }}
          LOJAHUB_ANALYTICS_TOKEN: ${{ secrets.LOJAHUB_ANALYTICS_TOKEN }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_ACCESS_TOKEN: ${{ secrets.ML_ACCESS_TOKEN }}
          ML_REFRESH_TOKEN: ${{ secrets.ML_REFRESH_TOKEN }}
          ML_SELLER_ID: ${{ secrets.ML_SELLER_ID }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          BRAVE_QUOTA_MES: ${{ vars.BRAVE_QUOTA_MES || '1800' }}
          BRAVE_QUOTA_ALERTA_PCT: ${{ vars.BRAVE_QUOTA_ALERTA_PCT || '80' }}
          BRAVE_QUOTA_HARD_STOP: ${{ vars.BRAVE_QUOTA_HARD_STOP || '1' }}
          MAGALU_CLIENT_ID: ${{ secrets.MAGALU_CLIENT_ID }}
          MAGALU_CLIENT_SECRET: ${{ secrets.MAGALU_CLIENT_SECRET }}
          MAGALU_ACCESS_TOKEN: ${{ secrets.MAGALU_ACCESS_TOKEN }}
          MAGALU_MERCHANT_ID: ${{ secrets.MAGALU_MERCHANT_ID }}
          MAGALU_REFRESH_TOKEN: ${{ secrets.MAGALU_REFRESH_TOKEN }}
          SHOPEE_PARTNER_ID: ${{ secrets.SHOPEE_PARTNER_ID }}
          SHOPEE_PARTNER_KEY: ${{ secrets.SHOPEE_PARTNER_KEY }}
          SHOPEE_SHOP_ID: ${{ secrets.SHOPEE_SHOP_ID }}
          SHOPEE_ACCESS_TOKEN: ${{ secrets.SHOPEE_ACCESS_TOKEN }}
          SHOPEE_REFRESH_TOKEN: ${{ secrets.SHOPEE_REFRESH_TOKEN }}
          AMAZON_LWA_CLIENT_ID: ${{ secrets.AMAZON_LWA_CLIENT_ID }}
          AMAZON_LWA_CLIENT_SECRET: ${{ secrets.AMAZON_LWA_CLIENT_SECRET }}
          AMAZON_REFRESH_TOKEN: ${{ secrets.AMAZON_REFRESH_TOKEN }}
          AMAZON_ACCESS_TOKEN: ${{ secrets.AMAZON_ACCESS_TOKEN }}
          AMAZON_SELLER_ID: ${{ secrets.AMAZON_SELLER_ID }}
          AMAZON_MARKETPLACE_ID: ${{ secrets.AMAZON_MARKETPLACE_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          WHATSAPP_API_TYPE: ${{ secrets.WHATSAPP_API_TYPE }}
          WHATSAPP_API_URL: ${{ secrets.WHATSAPP_API_URL }}
          WHATSAPP_API_KEY: ${{ secrets.WHATSAPP_API_KEY }}
          WHATSAPP_INSTANCE: ${{ secrets.WHATSAPP_INSTANCE }}
          WHATSAPP_NUMERO_DESTINO: ${{ secrets.WHATSAPP_NUMERO_DESTINO }}
          WHATSAPP_BUSINESS_TOKEN: ${{ secrets.WHATSAPP_BUSINESS_TOKEN }}
          WHATSAPP_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_ID }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GESTOR_CHAT_ID: ${{ secrets.TELEGRAM_GESTOR_CHAT_ID }}
      # Merge: restaura o conjunto, atualiza o que rodou e republica tudo —
      # senão o Vigia só vê o último produtor e perde os demais heartbeats.
      - name: Publicar heartbeats de saude
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            logs/orquestrador_ultimo_ciclo.json
            logs/operacao_24h_ultima.json
            logs/conectividade_ultima.json
            logs/renovacao_tokens_ultima.json
            logs/relatorio_manha_ml_ultima.json
            logs/esmaltes_mercado_history.json
            logs/estoque_ultima.json
            logs/ads_gatilho_ultima.json
            logs/ads_product_ads_404.json
            logs/chat_ultima.json
            logs/nfe_ultima.json
            logs/vendas_whatsapp_ultima.json
            logs/decisao_oscilacao_ultima.json
            logs/briefing_ruptura_impala_ultima.json
            logs/kits_compativeis_manicures_ultima.json
            logs/ponto_ruptura_segundo_cnpj_ultima.json
          key: saude-heartbeats-${{ github.run_id }}
      - name: Publicar estado vendas/IA
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            logs/claude_uso_orcamento.json
            logs/claude_toggle.json
            logs/marketplaces_operacao.json
            logs/conversao_manicures_ultima.json
            logs/chat_perguntas_claimed.json
            logs/brave_uso_mensal.json
          key: estado-vendas-ia-${{ github.run_id }}
      - name: Publicar cota Brave
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: logs/brave_uso_mensal.json
          key: brave-uso-mensal-${{ github.run_id }}
      - name: Publicar historico concorrentes ML + precificacao
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            logs/concorrentes_ml_history.json
            logs/ml_busca_termo_cache.json
            logs/sem_venda_ml_ultima.json
            logs/precificacao_inteligencia_history.json
          key: ml-concorrentes-history-${{ github.run_id }}
      - name: Publicar historico leiloes
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: logs/leilao_veiculos_history.json
          key: leilao-veiculos-history-${{ github.run_id }}
      - name: Publicar historico Alibaba
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: logs/alibaba_importacao_history.json
          key: alibaba-importacao-history-${{ github.run_id }}
      - name: Publicar cooldown Telegram
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: logs/alertas_cooldown.json
          key: telegram-cooldown-${{ github.run_id }}
