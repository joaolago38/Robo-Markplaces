name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  PYTHON_VERSION: "3.11"
  # NUNCA passar DD_API_KEY/DD_SITE/DD_LOGS_ENABLED aqui: este job roda
  # `pytest`, e qualquer `logger.error("boom")` usado como mock nos
  # testes seria enviado ao Datadog como erro real de produção se essas
  # variáveis estivessem disponíveis no processo. tests/__init__.py
  # também força DD_API_KEY vazia como segunda camada de proteção,
  # mas o certo é nem deixar a credencial real chegar neste job.

jobs:
  qualidade:
    name: Qualidade (lint + testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Testes
        run: python -m pytest -q
