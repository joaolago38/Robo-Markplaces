name: Sincronizar estoque marketplaces

# SERIALIZAÇÃO DE RENOVAÇÃO DE TOKENS:
# Sincronização de estoque chama APIs de marketplace que renovam access_token
# via refresh_token; deve aguardar outros workflows de renovação OAuth.

on:
  workflow_dispatch:
  schedule:
    # A cada 2h UTC (ex.: 0h UTC = 21h BRT do dia anterior)
    - cron: "0 */2 * * *"

concurrency:
  group: robo-markplaces-token-renewal
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  GH_REPO: ${{ github.repository }}
  DD_API_KEY: ${{ secrets.DD_API_KEY }}
  DD_SITE: ${{ secrets.DD_SITE || 'us5.datadoghq.com' }}
  DD_LOGS_ENABLED: ${{ secrets.DD_LOGS_ENABLED || 'true' }}
  DD_METRICS_ENABLED: ${{ vars.DD_METRICS_ENABLED || 'true' }}
  DD_ENV: ${{ vars.DD_ENV || 'production' }}

jobs:
  sincronizar:
    name: Estoque Bling → ML/Magalu/Shopee
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Restaurar heartbeats de saude
        uses: actions/cache@v4
        with:
          path: |
            logs/orquestrador_ultimo_ciclo.json
            logs/operacao_24h_ultima.json
            logs/conectividade_ultima.json
            logs/renovacao_tokens_ultima.json
            logs/relatorio_manha_ml_ultima.json
            logs/esmaltes_mercado_history.json
            logs/estoque_ultima.json
          key: saude-heartbeats-${{ github.run_id }}
          restore-keys: |
            saude-heartbeats-

      - name: Sincronizar estoque (dry_run=False)
        run: python -m agentes.sincronizar_estoque_marketplaces
        env:
          BLING_CLIENT_ID:         ${{ secrets.BLING_CLIENT_ID }}
          BLING_CLIENT_SECRET:     ${{ secrets.BLING_CLIENT_SECRET }}
          BLING_ACCESS_TOKEN:      ${{ secrets.BLING_ACCESS_TOKEN }}
          BLING_REFRESH_TOKEN:     ${{ secrets.BLING_REFRESH_TOKEN }}
          ML_CLIENT_ID:            ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET:        ${{ secrets.ML_CLIENT_SECRET }}
          ML_ACCESS_TOKEN:         ${{ secrets.ML_ACCESS_TOKEN }}
          ML_REFRESH_TOKEN:        ${{ secrets.ML_REFRESH_TOKEN }}
          ML_SELLER_ID:            ${{ secrets.ML_SELLER_ID }}
          MAGALU_CLIENT_ID:        ${{ secrets.MAGALU_CLIENT_ID }}
          MAGALU_CLIENT_SECRET:    ${{ secrets.MAGALU_CLIENT_SECRET }}
          MAGALU_ACCESS_TOKEN:     ${{ secrets.MAGALU_ACCESS_TOKEN }}
          MAGALU_REFRESH_TOKEN:    ${{ secrets.MAGALU_REFRESH_TOKEN }}
          MAGALU_MERCHANT_ID:      ${{ secrets.MAGALU_MERCHANT_ID }}
          SHOPEE_PARTNER_ID:       ${{ secrets.SHOPEE_PARTNER_ID }}
          SHOPEE_PARTNER_KEY:      ${{ secrets.SHOPEE_PARTNER_KEY }}
          SHOPEE_SHOP_ID:          ${{ secrets.SHOPEE_SHOP_ID }}
          SHOPEE_ACCESS_TOKEN:     ${{ secrets.SHOPEE_ACCESS_TOKEN }}
          SHOPEE_REFRESH_TOKEN:    ${{ secrets.SHOPEE_REFRESH_TOKEN }}
          TELEGRAM_TOKEN:          ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_GESTOR_CHAT_ID: ${{ secrets.TELEGRAM_GESTOR_CHAT_ID }}

      - name: Publicar heartbeats de saude
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            logs/orquestrador_ultimo_ciclo.json
            logs/operacao_24h_ultima.json
            logs/conectividade_ultima.json
            logs/renovacao_tokens_ultima.json
            logs/relatorio_manha_ml_ultima.json
            logs/esmaltes_mercado_history.json
            logs/estoque_ultima.json
          key: saude-heartbeats-${{ github.run_id }}
