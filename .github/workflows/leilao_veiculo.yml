name: Monitor Leilões Veículos

on:
  workflow_dispatch:
  schedule:
    # A cada hora (UTC) — cobertura contínua 24h via GitHub Actions
    - cron: "0 * * * *"

concurrency:
  group: robo-markplaces-token-renewal
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  DD_API_KEY: ${{ secrets.DD_API_KEY }}
  DD_SITE: ${{ secrets.DD_SITE }}
  DD_LOGS_ENABLED: ${{ secrets.DD_LOGS_ENABLED }}
  LEILAO_INCLUIR_SUMARE_DIRETO: "1"
  LEILAO_DETRAN_POR_RODADA: "5"
  LEILAO_LEILOEIROS_POR_RODADA: "5"
  LEILAO_PAUSA_ENTRE_FONTES_SEG: "3"
  LEILAO_PRECO_MAX_LANCE: "35000"
  LEILAO_ANO_MIN: "1995"
  LEILAO_ANO_MAX: "2020"
  LEILAO_BUSCA_TODOS_VEICULOS: "1"
  LEILAO_VARREDURA_TODAS_FONTES: "1"
  LEILAO_ALERTAR_TODOS_ACHADOS: "1"
  LEILAO_MARGEM_FIPE_MIN_PCT: "10"
  LEILAO_MARGEM_FIPE_MIN_REAIS: "800"
  DDG_MIN_INTERVAL_SEG: "3"

jobs:
  monitorar:
    name: Varredura leiloeiros + DETRAN (rotacionado) + Sumaré
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Restaurar histórico de achados
        uses: actions/cache@v4
        with:
          path: logs/leilao_veiculos_history.json
          key: leilao-veiculos-history-${{ github.run_id }}
          restore-keys: |
            leilao-veiculos-history-
      - name: Restaurar cooldown de alertas Telegram
        uses: actions/cache@v4
        with:
          path: logs/alertas_cooldown.json
          key: telegram-cooldown-${{ github.run_id }}
          restore-keys: |
            telegram-cooldown-
      - name: Preflight Telegram (gestor)
        run: python scripts/preflight_monitor_telegram.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_GESTOR_CHAT_ID: ${{ secrets.TELEGRAM_GESTOR_CHAT_ID }}
      - name: Rodar monitor de leilões de veículos
        run: python -m agentes.leilao.agente_leilao_veiculo
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_GESTOR_CHAT_ID: ${{ secrets.TELEGRAM_GESTOR_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Salvar historico de achados (backup)
        uses: actions/upload-artifact@v4
        with:
          name: leilao-veiculos-history
          path: |
            logs/leilao_veiculos_history.json
            logs/leilao_veiculos_ultima.json
          retention-days: 90
          if-no-files-found: ignore
