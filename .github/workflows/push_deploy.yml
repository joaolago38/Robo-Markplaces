name: Push deploy local (manual)

on:
  workflow_dispatch:
    inputs:
      sem_push:
        description: "Pular git push (só rodar agentes)"
        type: boolean
        default: false
      sem_preflight:
        description: "Pular ruff e pytest"
        type: boolean
        default: false
      mensagem_commit:
        description: "Mensagem do commit (se houver alterações)"
        type: string
        default: "chore: deploy via workflow manual"

concurrency:
  group: robo-markplaces-token-renewal
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  DD_API_KEY: ${{ secrets.DD_API_KEY }}
  DD_SITE: ${{ secrets.DD_SITE }}
  DD_LOGS_ENABLED: ${{ secrets.DD_LOGS_ENABLED }}
  DD_METRICS_ENABLED: ${{ vars.DD_METRICS_ENABLED || 'true' }}
  DD_ENV: ${{ vars.DD_ENV || 'production' }}

jobs:
  push_deploy:
    name: Push + sync completo
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Restaurar cooldown Telegram
        uses: actions/cache@v4
        with:
          path: logs/alertas_cooldown.json
          key: telegram-cooldown-${{ github.run_id }}
          restore-keys: |
            telegram-cooldown-
      - name: Push deploy (git + todos os agentes)
        run: |
          ARGS=""
          if [ "${{ inputs.sem_push }}" = "true" ]; then ARGS="$ARGS --sem-push"; fi
          if [ "${{ inputs.sem_preflight }}" = "true" ]; then ARGS="$ARGS --sem-preflight"; fi
          python -m agentes.orquestrador.agente_push_deploy \
            --mensagem "${{ inputs.mensagem_commit }}" \
            $ARGS
        env:
          ORQUESTRADOR_EXCLUIR: leilao,alibaba,alibaba_inteligencia,alibaba_sourcing,ml_tendencias_importacao,monitor_filamentos_ml,monitor_masterprint_petg,monitor_masterprint_escritorio,licitacoes,ads_gatilho,relatorio_estrategia_ml,vigia_datadog,promocoes_manicures,resumo_diario_novamix,resumo_conta_ml,montar_kits_impala,esmaltes_operacao
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_ATIVO: ${{ vars.CLAUDE_ATIVO || '1' }}
          BLING_CLIENT_ID: ${{ secrets.BLING_CLIENT_ID }}
          BLING_CLIENT_SECRET: ${{ secrets.BLING_CLIENT_SECRET }}
          BLING_ACCESS_TOKEN: ${{ secrets.BLING_ACCESS_TOKEN }}
          BLING_REFRESH_TOKEN: ${{ secrets.BLING_REFRESH_TOKEN }}
          LOJAHUB_TOKEN: ${{ secrets.LOJAHUB_TOKEN }}
          LOJAHUB_ANALYTICS_TOKEN: ${{ secrets.LOJAHUB_ANALYTICS_TOKEN }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_ACCESS_TOKEN: ${{ secrets.ML_ACCESS_TOKEN }}
          ML_REFRESH_TOKEN: ${{ secrets.ML_REFRESH_TOKEN }}
          ML_SELLER_ID: ${{ secrets.ML_SELLER_ID }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          MAGALU_CLIENT_ID: ${{ secrets.MAGALU_CLIENT_ID }}
          MAGALU_CLIENT_SECRET: ${{ secrets.MAGALU_CLIENT_SECRET }}
          MAGALU_ACCESS_TOKEN: ${{ secrets.MAGALU_ACCESS_TOKEN }}
          MAGALU_MERCHANT_ID: ${{ secrets.MAGALU_MERCHANT_ID }}
          MAGALU_REFRESH_TOKEN: ${{ secrets.MAGALU_REFRESH_TOKEN }}
          SHOPEE_PARTNER_ID: ${{ secrets.SHOPEE_PARTNER_ID }}
          SHOPEE_PARTNER_KEY: ${{ secrets.SHOPEE_PARTNER_KEY }}
          SHOPEE_SHOP_ID: ${{ secrets.SHOPEE_SHOP_ID }}
          SHOPEE_ACCESS_TOKEN: ${{ secrets.SHOPEE_ACCESS_TOKEN }}
          SHOPEE_REFRESH_TOKEN: ${{ secrets.SHOPEE_REFRESH_TOKEN }}
          AMAZON_LWA_CLIENT_ID: ${{ secrets.AMAZON_LWA_CLIENT_ID }}
          AMAZON_LWA_CLIENT_SECRET: ${{ secrets.AMAZON_LWA_CLIENT_SECRET }}
          AMAZON_REFRESH_TOKEN: ${{ secrets.AMAZON_REFRESH_TOKEN }}
          AMAZON_ACCESS_TOKEN: ${{ secrets.AMAZON_ACCESS_TOKEN }}
          AMAZON_SELLER_ID: ${{ secrets.AMAZON_SELLER_ID }}
          AMAZON_MARKETPLACE_ID: ${{ secrets.AMAZON_MARKETPLACE_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          WHATSAPP_API_TYPE: ${{ secrets.WHATSAPP_API_TYPE }}
          WHATSAPP_API_URL: ${{ secrets.WHATSAPP_API_URL }}
          WHATSAPP_API_KEY: ${{ secrets.WHATSAPP_API_KEY }}
          WHATSAPP_INSTANCE: ${{ secrets.WHATSAPP_INSTANCE }}
          WHATSAPP_NUMERO_DESTINO: ${{ secrets.WHATSAPP_NUMERO_DESTINO }}
          WHATSAPP_BUSINESS_TOKEN: ${{ secrets.WHATSAPP_BUSINESS_TOKEN }}
          WHATSAPP_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_ID }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GESTOR_CHAT_ID: ${{ secrets.TELEGRAM_GESTOR_CHAT_ID }}
          PUSH_DEPLOY_RODAR_TESTES: "0"
          PUSH_DEPLOY_RODAR_RUFF: "0"
