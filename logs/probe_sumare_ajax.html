        <script>
            $(document).ready(function() {
                $('.dropdown-categorias li.comsubmenu').on("click", function(e){
                    $('.dropdown-categorias ul.show').next('ul').toggle();
                    
                    $(this).parent('li').children('ul').toggle();
                    
                    e.stopPropagation();
                    e.preventDefault();
                });
                

                $('.dropdown-categorias a').on('click', function() {
                    var subCategory = $(this).attr('subCategory');
                    
                    if(subCategory == 'Todos os tipos'){
                        $('#searchLotsType').val('');
                        $('#labelCategoria').val(subCategory);
                    }else{
                        $('#searchLotsType').val(subCategory);
                        subCategory = $(this).parents('li.comsubmenu').attr("categoria_nome") + "<br>" + $(this).text();
                        $('#labelCategoria').val(subCategory);
                    }


                    if(!$('.dropdown-categorias').attr('nosubmit')){
                        var form = $(this).closest('form');
                        if (form.length > 0)form.submit();
                    }else{
                        $('.botao-menu-categorias').html(subCategory);
                        $('.dropdown-categorias').removeClass('show');
                    }

                    
                });

               
            });
           
        </script>

            <script>
        $("#login-form-mail").on('submit', function(event){
            // criar chamada ajax para saber se o email foi migrado e se precisa ser redirecionado para "Esqueci minha senha".
            event.preventDefault();
            $("#login-form-mail-wrapper").removeClass("active");
            $("#login-form-pass-wrapper").addClass("active");
            $("#email").val($("#email-initial").val());
            $(".login-message-email").removeClass("active");
            $(".login-message-pass").addClass("active");
            $(window).scrollTop(0);
            $("#password").focus();
            $("#forgot-password-link a").attr('href',$("#forgot-password-link a").attr('href') + $("#email").val());
        });
    </script>
